<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>UMAXIANO</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --papel:#faf8f4;--tinta:#141013;--rojo:#bd0811;--rojo-osc:#9a161c;
  --oro:#b66800;--oro-cl:#d99a2b;--gris:#9f9f9f;--gris-osc:#606060;
  --linea:rgba(20,16,19,.10);
  --display:'Instrument Serif',Georgia,serif;--ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--tinta);background:var(--papel);height:100svh;overflow:hidden;position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── PUZLE A PANTALLA COMPLETA ── */
.board-svg{position:fixed;inset:0;width:100vw;height:100svh;display:block;transition:transform 3.2s cubic-bezier(.2,.7,.2,1);transform-origin:50% 50%}
.board-svg.complete{transform:scale(1.16)}
/* cara final blanca con el nombre del valor */
/* cierre: destellos + logo UMAXIANOS */
.endcard{position:fixed;inset:0;z-index:39;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;pointer-events:none;
  background:transparent}
.endcard.on{display:flex;animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.final-logo{width:min(74vh,92vw);aspect-ratio:16/9;background-image:var(--img);background-size:contain;background-repeat:no-repeat;background-position:center;
  animation:logoPop 1s cubic-bezier(.2,1.4,.3,1) both, logoGlow 3s ease-in-out 1s infinite}
@keyframes logoPop{0%{opacity:0;transform:scale(.6) rotate(-4deg)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(120,44,191,0))}50%{filter:drop-shadow(0 0 26px rgba(120,44,191,.35))}}
.endcard .endtext{font-family:var(--display);font-size:clamp(2.2rem,7vh,4rem);color:var(--rojo);animation:rise 1s ease .3s both}
.endcard .endrestart{pointer-events:auto;background:rgba(255,255,255,.8);color:var(--tinta);border-color:var(--linea)}
.endcard .endrestart:hover{border-color:var(--gris)}
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;
  background:radial-gradient(circle, #fff 0%, #ffd76a 45%, rgba(255,215,106,0) 70%);
  opacity:0;transform:scale(0);animation:twinkle 1.8s ease-in-out infinite}
.spark::before,.spark::after{content:"";position:absolute;inset:0;background:inherit;border-radius:inherit}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.6)}}
.pieza{cursor:pointer}
.pieza .cover{transition:opacity .5s ease}
.pieza .contorno{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:2.5;vector-effect:non-scaling-stroke;transition:stroke-opacity .5s,stroke .4s,stroke-width .3s}
.pieza .slice-img{opacity:0;transition:opacity .9s ease .05s}
.pieza .num{font-family:var(--display);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.9}
.pieza .valname{font-family:var(--ui);font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:.6px}
.pieza.locked{cursor:not-allowed}
.pieza.available{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.pieza.available .contorno{stroke:#fff;stroke-opacity:1;stroke-width:4;filter:drop-shadow(0 0 10px rgba(255,255,255,.6))}
.pieza:hover.available{transform:scale(1.02);transform-box:fill-box;transform-origin:center}
.pieza.done{cursor:default}
.pieza .namecard{opacity:0;transition:opacity .6s ease}
.pieza.named .namecard{opacity:1}
.pieza.named .slice-img{opacity:0}
.pieza.done .cover{opacity:0;pointer-events:none}
.pieza.done .contorno{stroke:var(--tinta);stroke-opacity:.14;stroke-width:1.5}
.pieza.revealed .namecard{opacity:0}
.pieza.revealed .slice-img{opacity:1}
.nmc{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;font-family:var(--ui);font-weight:700;line-height:1.12;letter-spacing:.02em}
.pieza.settling{animation:settle .8s cubic-bezier(.2,1.4,.3,1);transform-box:fill-box;transform-origin:center}
@keyframes settle{0%{transform:scale(1.06)}55%{transform:scale(.97)}100%{transform:scale(1)}}

/* ── overlay superior (marca + progreso) minimal ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(12px,2.5vh,22px) clamp(16px,3vw,34px);pointer-events:none;
  background:linear-gradient(180deg,rgba(250,248,244,.85),rgba(250,248,244,0))}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand img{height:clamp(24px,3.6vh,36px)}
.topbar .brand .wordmark{font-family:var(--ui);font-weight:700;letter-spacing:.22em;font-size:.62rem;text-transform:uppercase;color:var(--gris-osc)}
.topbar .count{font-family:var(--display);font-size:clamp(1.1rem,2.6vh,1.6rem);color:var(--rojo)}
.hint{position:fixed;left:0;right:0;bottom:0;z-index:20;text-align:center;pointer-events:none;
  padding:clamp(10px,2vh,20px);color:var(--gris-osc);font-size:clamp(.72rem,1.7vh,.9rem);
  background:linear-gradient(0deg,rgba(250,248,244,.85),rgba(250,248,244,0));transition:opacity .4s}

/* ── zoom del clic → video ── */
.zoomer{position:fixed;z-index:60;overflow:hidden;border-radius:10px;
  transition:transform .55s cubic-bezier(.5,0,.2,1),border-radius .55s;transform-origin:0 0;will-change:transform}
.zoomer .zface{position:absolute;inset:0}
.zoomer .zvideo{position:absolute;inset:0;opacity:0;transition:opacity .35s ease .1s;background:#000}
.zoomer .zvideo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ── destellos del cierre ── */
#burst{position:fixed;left:50%;top:50%;z-index:37;pointer-events:none;display:none;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,244,205,.95),rgba(255,215,106,.55),transparent 70%)}
#burst.on{display:block;animation:burst 1.15s ease-out both}
@keyframes burst{0%{opacity:.95;width:60px;height:60px}100%{opacity:0;width:170vmax;height:170vmax}}
#shine{position:fixed;inset:0;z-index:37;pointer-events:none;display:none;overflow:hidden}
#shine.on{display:block}
#shine::before{content:"";position:absolute;top:-50%;left:-60%;width:38%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:rotate(18deg);
  animation:sweep 1.6s ease-in-out .15s 1 both}
@keyframes sweep{from{left:-60%}to{left:120%}}

#sparkles{position:fixed;inset:0;z-index:38;pointer-events:none;display:none}
#sparkles.on{display:block}
.spark{position:absolute;width:var(--sz);height:var(--sz);transform:translate(-50%,-50%);opacity:0;
  background:radial-gradient(circle,#fff 0%,#ffd76a 45%,transparent 72%);border-radius:50%;
  animation:tw 1.7s ease-in-out infinite}
.spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(#fff,#ffd76a)}
.spark::before{width:1.6px;height:230%}
.spark::after{height:1.6px;width:230%}
@keyframes tw{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.25)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* ── overlays de mensaje / giro / final ── */
.stage{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,48px)}
.stage.on{display:flex}
.stage.dark{background:#000}
.stage.light{background:rgba(250,248,244,.94);backdrop-filter:blur(8px)}
.stage-inner{width:100%;max-width:900px;max-height:100svh;text-align:center;animation:zoomIn .45s cubic-bezier(.2,1,.3,1)}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.value-eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--oro);margin-bottom:14px}
.controls{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.msg-eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;margin-bottom:18px;color:#e8626a}
.msg-text{font-family:var(--display);font-size:2.4rem;line-height:1.28;max-width:min(30ch,90vw);margin:0 auto;color:#fff;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.reveal{perspective:1300px}
.flip{position:relative;width:min(360px,74vw);aspect-ratio:1/1;margin:0 auto;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.85,.2,1)}
.flip.turned{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backface-visibility:hidden;padding:24px;text-align:center}
.flip .front{background:#fff;border:1px solid var(--linea);box-shadow:0 20px 50px rgba(20,16,19,.14)}
.flip .front .q{font-family:var(--display);font-size:4.4rem;color:var(--rojo)}
.flip .front .tag{color:var(--gris);letter-spacing:.2em;text-transform:uppercase;font-size:.72rem}
.flip .back{background:linear-gradient(150deg,var(--rojo),var(--rojo-osc));transform:rotateY(180deg);color:#fff;box-shadow:0 24px 60px rgba(189,8,17,.4)}
.flip .back .value-name{font-family:var(--display);font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.05}
.flip .back .value-index{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.final-img{width:min(72vh,92vw);aspect-ratio:16/9;margin:0 auto 22px;border-radius:16px;background-image:var(--img);background-size:cover;background-position:center;background-color:var(--papel);box-shadow:0 30px 80px rgba(20,16,19,.28);animation:reveal-pop 1s cubic-bezier(.2,1.3,.3,1)}
@keyframes reveal-pop{0%{opacity:0;transform:scale(.9)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
.final-title{font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin-bottom:10px}
.final-msg{color:var(--gris-osc);max-width:48ch;margin:0 auto 22px;line-height:1.55}
.btn{font-family:var(--ui);font-weight:600;font-size:.9rem;padding:13px 28px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--rojo);color:#fff;box-shadow:0 8px 22px rgba(189,8,17,.32)}
.btn-primary:hover{background:var(--rojo-osc);box-shadow:0 12px 30px rgba(189,8,17,.4)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn-ghost:hover{border-color:#fff}
.btn-dark{background:transparent;color:var(--tinta);border-color:var(--linea)}
.btn-dark:hover{border-color:var(--gris)}
</style>
</head>
<body>
<svg class="board-svg" id="board" preserveAspectRatio="none" aria-label="Rompecabezas de valores"></svg>

<div class="topbar">
  <div class="brand">
    <img id="logo" alt="Universidad María Auxiliadora" style="display:none" />
    <span class="wordmark" id="wordmark">UMAX</span>
  </div>
  <div class="count" id="count">0 / 10</div>
</div>
<div class="hint" id="hint"></div>

<div id="sparkles"></div>
<div id="shine"></div>
<div id="burst"></div>
<div class="endcard" id="endcard">
  <div class="sparkles" id="sparkles"></div>
  <div class="final-logo" id="finalLogo" aria-hidden="true" style="display:none"></div>
  <div class="endtext"></div>
  <button class="btn endrestart" onclick="location.reload()"></button>
</div>

<div class="zoomer" id="zoomer" style="display:none"><div class="zface" id="zface"></div><div class="zvideo" id="zvideo"></div></div>
<div class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></div>

function lum(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return 0.2126*r+0.7152*g+0.0722*b;}

function wrapName(cx,cy,idx,name,color,muted,boxW,boxH,central){
  const words=name.toUpperCase().split(/\s+/);
  let fs= central?52:32;
  const padW=boxW-44;
  const labelFS=Math.max(15,Math.round((central?52:32)*0.44));
  const labelLh=labelFS*1.8;
  const padH=boxH-30-labelLh;
  const longest=Math.max.apply(null,words.map(w=>w.length));
  while(longest*fs*0.60>padW && fs>14) fs-=1;
  const cpl=Math.max(4,Math.floor(padW/(fs*0.60)));
  const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(t.length<=cpl){line=t;} else {if(line)lines.push(line); line=w;} }
  if(line)lines.push(line);
  let lh=fs*1.12;
  while(lines.length*lh>padH && fs>12){ fs-=1; lh=fs*1.12; }
  const total=labelLh+lines.length*lh, top=cy-total/2;
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family',"'Inter',system-ui,sans-serif");t.setAttribute('font-weight','700');
  const lb=document.createElementNS(SVGNS,'tspan');
  lb.setAttribute('x',cx);lb.setAttribute('y',top+labelFS);lb.setAttribute('font-size',labelFS);lb.setAttribute('fill',muted);lb.setAttribute('letter-spacing','3');lb.setAttribute('font-weight','600');lb.setAttribute('stroke','#fff');lb.setAttribute('stroke-width',Math.max(2,labelFS*0.16));lb.setAttribute('paint-order','stroke');lb.setAttribute('stroke-linejoin','round');
  lb.textContent='Valor '+idx;
  t.appendChild(lb);
  const nameTop=top+labelLh;
  lines.forEach((ln,k)=>{const ts=document.createElementNS(SVGNS,'tspan');ts.setAttribute('x',cx);ts.setAttribute('y',nameTop+fs+k*lh);ts.setAttribute('font-size',fs);ts.setAttribute('fill',color);ts.setAttribute('letter-spacing','.5');ts.setAttribute('stroke','#fff');ts.setAttribute('stroke-width',Math.max(3,fs*0.14));ts.setAttribute('paint-order','stroke');ts.setAttribute('stroke-linejoin','round');ts.textContent=ln;t.appendChild(ts);});
  return t;
}
function readable(hex){const h=hex.replace('#','');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);let f=1;const L=()=>0.2126*r*f+0.7152*g*f+0.0722*b*f;while(L()>120&&f>0.18)f-=0.08;return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;}


let current=0, solved=0, player=null;
const stage=document.getElementById('stage');
const inner=document.getElementById('stageInner');
const board=document.getElementById('board');
const zoomer=document.getElementById('zoomer');
const zface=document.getElementById('zface');
const zvideo=document.getElementById('zvideo');
const SVGNS="http://www.w3.org/2000/svg";
const hasImg=!!IMAGEN_PROYECTO;
const imgVar=hasImg?`url("${IMAGEN_PROYECTO}")`:`linear-gradient(135deg,#bd0811 0%,#9a161c 45%,#b66800 100%)`;

board.setAttribute('viewBox',`0 0 ${VBW} ${VBH}`);
if(LOGO_UMAX){const lg=document.getElementById('logo');lg.src=LOGO_UMAX;lg.style.display='block';document.getElementById('wordmark').style.display='none';}

const defs=document.createElementNS(SVGNS,'defs');
PIECE_PATHS.forEach((d,i)=>{
  const cp=document.createElementNS(SVGNS,'clipPath');cp.id='clip'+i;
  const pp=document.createElementNS(SVGNS,'path');pp.setAttribute('d',d);cp.appendChild(pp);defs.appendChild(cp);
  const [c1,c2]=ACCENTS[i];
  const g=document.createElementNS(SVGNS,'linearGradient');g.id='grad'+i;
  g.setAttribute('x1','0');g.setAttribute('y1','0');g.setAttribute('x2','1');g.setAttribute('y2','1');
  const s1=document.createElementNS(SVGNS,'stop');s1.setAttribute('offset','0');s1.setAttribute('stop-color',c1);
  const s2=document.createElementNS(SVGNS,'stop');s2.setAttribute('offset','1');s2.setAttribute('stop-color',c2);
  g.appendChild(s1);g.appendChild(s2);defs.appendChild(g);
});
board.appendChild(defs);

const pieces=[];
PIECE_PATHS.forEach((d,i)=>{
  const isCentral=(i===9);
  const g=document.createElementNS(SVGNS,'g');
  g.setAttribute('class','pieza locked');g.style.animationDelay=(i*0.05)+'s';

  // 1) porción del logo UMAXIANOS (oculta hasta el final)
  if(hasImg){
    const img=document.createElementNS(SVGNS,'image');
    img.setAttribute('href',IMAGEN_PROYECTO);img.setAttribute('x','0');img.setAttribute('y','0');
    img.setAttribute('width',VBW);img.setAttribute('height',VBH);
    img.setAttribute('preserveAspectRatio','xMidYMid slice');
    img.setAttribute('clip-path','url(#clip'+i+')');img.setAttribute('class','slice-img');g.appendChild(img);
  }

  // 2) cara descubierta: fondo BLANCO + nombre del valor
  const nc=document.createElementNS(SVGNS,'g');nc.setAttribute('class','namecard');nc.setAttribute('clip-path','url(#clip'+i+')');
  const whiteFace=document.createElementNS(SVGNS,'rect');
  whiteFace.setAttribute('x','0');whiteFace.setAttribute('y','0');
  whiteFace.setAttribute('width',VBW);whiteFace.setAttribute('height',VBH);
  whiteFace.setAttribute('fill','#fff');
  nc.appendChild(whiteFace);
  nc.appendChild(wrapName(CENTERS[i][0],CENTERS[i][1],(i+1),ITEMS[i].nombre,readable(ACCENTS[i][0]),'#9b9b9b',BOX[i][0],BOX[i][1],isCentral));
  g.appendChild(nc);

  // 3) cara inicial: color + número
  const cover=document.createElementNS(SVGNS,'g');cover.setAttribute('class','cover');cover.setAttribute('clip-path','url(#clip'+i+')');
  const fondo=ITEMS[i].fondo;
  if(fondo){
    const bi=document.createElementNS(SVGNS,'image');
    bi.setAttribute('href',fondo);bi.setAttribute('x','0');bi.setAttribute('y','0');bi.setAttribute('width',VBW);bi.setAttribute('height',VBH);
    bi.setAttribute('preserveAspectRatio','xMidYMid slice');cover.appendChild(bi);
    const veil=document.createElementNS(SVGNS,'rect');veil.setAttribute('width',VBW);veil.setAttribute('height',VBH);veil.setAttribute('fill','url(#grad'+i+')');veil.setAttribute('opacity','.72');cover.appendChild(veil);
  }else{
    const r=document.createElementNS(SVGNS,'rect');r.setAttribute('width',VBW);r.setAttribute('height',VBH);r.setAttribute('fill','url(#grad'+i+')');cover.appendChild(r);
  }
  const num=document.createElementNS(SVGNS,'text');num.setAttribute('class','num');
  num.setAttribute('x',CENTERS[i][0]);num.setAttribute('y',CENTERS[i][1]);
  num.setAttribute('font-size',isCentral?'150':'92');
  const claro = lum(ACCENTS[i][0])>150;
  num.setAttribute('fill', claro ? '#141013' : '#fff');
  num.setAttribute('stroke', claro ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.22)');
  num.setAttribute('stroke-width','2'); num.setAttribute('paint-order','stroke');
  num.textContent=(i+1);cover.appendChild(num);
  g.appendChild(cover);

  const out=document.createElementNS(SVGNS,'path');out.setAttribute('class','contorno');out.setAttribute('d',d);g.appendChild(out);
  g.addEventListener('click',()=>{ if(i===current && !g.classList.contains('done')) openItem(i); });
  board.appendChild(g);
  pieces.push(g);
});
pieces[0].classList.remove('locked');pieces[0].classList.add('available');

function show(html,mode){ inner.innerHTML=html; stage.className='stage on '+(mode||'light'); }
function hide(){ stage.className='stage'; inner.innerHTML=''; }
function destroyPlayer(){ if(player){try{player.destroy();}catch(e){} player=null;} }
function ytEmbed(){ return '<div id="ytplayer" style="position:absolute;inset:0"></div>'; }
let pending=null;
// pantalla completa real (maximizada), best-effort multi-navegador
function enterFullscreen(){
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(fn && !document.fullscreenElement){ try{ fn.call(el); }catch(_){} }
}
function forceHD(p){ try{ p.setPlaybackQuality('hd1080'); }catch(_){} }
function mountPlayer(id,onEnd){
  destroyPlayer();
  if(!id) return;
  if(!window.YT||!YT.Player){ pending={id,onEnd}; return; }
  player=new YT.Player('ytplayer',{
    videoId:id,
    playerVars:{rel:0,modestbranding:1,playsinline:1,autoplay:1,controls:1,vq:'hd1080'},
    events:{
      onReady:e=>{ forceHD(e.target); try{e.target.playVideo();}catch(_){} },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING) forceHD(e.target);   // reforzar 1080
        if(e.data===YT.PlayerState.ENDED) onEnd();
      }
    }
  });
}

/* ── clic → ZOOM del cuadro hacia video en pantalla completa ── */
function openItem(i){
  const it=ITEMS[i];
  enterFullscreen();                 // maximizar (dentro del gesto del clic)
  const rect=pieces[i].getBoundingClientRect();
  const [c1,c2]=ACCENTS[i];
  // preparar zoomer a pantalla completa, pero transformado para calzar en la pieza
  zoomer.style.display='block';
  zoomer.style.left='0';zoomer.style.top='0';zoomer.style.width='100vw';zoomer.style.height='100svh';
  zface.style.background=`linear-gradient(150deg,${c1},${c2})`;
  zvideo.style.opacity='0'; zvideo.innerHTML=ytEmbed();
  const sx=rect.width/window.innerWidth, sy=rect.height/window.innerHeight;
  zoomer.style.transition='none';
  zoomer.style.transform=`translate(${rect.left}px,${rect.top}px) scale(${sx},${sy})`;
  zoomer.style.borderRadius='10px';
  // forzar reflow y animar a pantalla completa
  void zoomer.offsetWidth;
  requestAnimationFrame(()=>{
    zoomer.style.transition='transform .55s cubic-bezier(.5,0,.2,1),border-radius .55s';
    zoomer.style.transform='translate(0px,0px) scale(1,1)';
    zoomer.style.borderRadius='0px';
  });
  // reproducir YA (dentro del gesto del clic) → autoplay con sonido
  if(it.youtube){ mountPlayer(it.youtube,()=>afterVideo(i)); }
  // al terminar el zoom, mostrar el video y el control del presentador
  setTimeout(()=>{
    zvideo.style.opacity='1';
    if(!it.youtube){ zvideo.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.9rem">Sin video · agregá el id de YouTube en la CONFIG</div>'; }
    const ctrl=document.createElement('div');
    ctrl.style.cssText='position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;z-index:5';
    ctrl.innerHTML='<button class="btn btn-ghost" style="backdrop-filter:blur(6px);background:rgba(0,0,0,.35)">Continuar</button>';
    ctrl.querySelector('button').onclick=()=>afterVideo(i);
    zvideo.appendChild(ctrl);
  },560);
}

function closeZoom(){ destroyPlayer(); zoomer.style.display='none'; zvideo.innerHTML=''; }

function afterVideo(i){
  closeZoom();
  stepMessage(i);
}

/* ── pantalla negra + mensaje ── */
function stepMessage(i){
  const it=ITEMS[i];
  show(`<p class="msg-eyebrow">Un momento para reflexionar</p>
    <p class="msg-text">${it.mensaje}</p>
    <div class="controls"><button class="btn btn-ghost" onclick="stepReveal(${i})">Descubrir el valor</button></div>`,'dark');
  fitMessage();
}

// reduce el tamaño del texto hasta que el mensaje entre en la pantalla
function fitMessage(){
  requestAnimationFrame(()=>{
    const el=inner.querySelector('.msg-text');
    if(!el) return;
    const avail=window.innerHeight*0.66;
    let size=Math.min(window.innerWidth*0.045, 52);
    el.style.fontSize=size+'px';
    let guard=0;
    while(el.scrollHeight>avail && size>15 && guard<80){ size-=1.5; el.style.fontSize=size+'px'; guard++; }
  });
}

/* ── giro que revela el valor ── */
function stepReveal(i){
  const it=ITEMS[i];
  show(`<div class="reveal"><div class="flip" id="flip">
      <div class="face front"><span class="q">?</span><span class="tag">Valor ${i+1}</span></div>
      <div class="face back"><span class="value-index">Valor ${i+1}</span><span class="value-name">${it.nombre}</span></div>
    </div></div>
    <div class="controls" id="revealCtrl" style="opacity:0;pointer-events:none;transition:opacity .5s">
      <button class="btn btn-primary" onclick="settlePiece(${i})">Colocar la pieza</button></div>`,'light');
  requestAnimationFrame(()=>setTimeout(()=>{
    document.getElementById('flip').classList.add('turned');
    const c=document.getElementById('revealCtrl');
    setTimeout(()=>{c.style.opacity='1';c.style.pointerEvents='auto';},1000);
  },400));
}

/* ── la pieza se coloca y revela su parte del logo ── */
function settlePiece(i){
  hide();
  const p=pieces[i];p.classList.remove('available');p.classList.add('done','settling');
  if(i<9) p.classList.add('named');
  setTimeout(()=>p.classList.remove('settling'),800);
  solved++;updateCount();
  if(i<8){ current=i+1;const nx=pieces[i+1];nx.classList.remove('locked');nx.classList.add('available');setHint(''); }
  else if(i===8){ current=9;const c=pieces[9];c.classList.remove('locked');c.classList.add('available');setHint(''); }
  else if(i===9){ finalReveal(); }
}

function finalReveal(){
  setHint('');
  // Solo aquí se descubre la imagen completa de UMAXIANOS.
  // Las piezas anteriores permanecen con su cara blanca y su valor hasta este momento.
  pieces.forEach(p=>p.classList.add('revealed'));
  pieces.forEach(p=>p.classList.remove('named'));
  pieces[9].classList.add('done');
  // estallido dorado + barrido de brillo
  const burst=document.getElementById('burst'); burst.classList.remove('on'); void burst.offsetWidth; burst.classList.add('on');
  const shine=document.getElementById('shine'); shine.classList.remove('on'); void shine.offsetWidth; shine.classList.add('on');
  // muchos destellos
  const sp=document.getElementById('sparkles'); sp.innerHTML='';
  for(let k=0;k<130;k++){const s=document.createElement('div');s.className='spark';s.style.left=(Math.random()*100)+'vw';s.style.top=(Math.random()*100)+'vh';s.style.animationDelay=(Math.random()*1.8)+'s';s.style.animationDuration=(1.1+Math.random()*1.1)+'s';s.style.setProperty('--sz',(5+Math.random()*16)+'px');sp.appendChild(s);}
  sp.classList.add('on');
  // zoom más notorio
  setTimeout(()=>board.classList.add('complete'),120);
  setTimeout(()=>document.getElementById('endcard').classList.add('on'),1100);
}

function updateCount(){document.getElementById('count').textContent=`${solved} / 10`;}
function setHint(t){const h=document.getElementById('hint');h.style.opacity='0';setTimeout(()=>{h.textContent=t;h.style.opacity=t?'1':'0';},200);}
function onYouTubeIframeAPIReady(){ if(pending && document.getElementById('ytplayer')){ const p=pending; pending=null; mountPlayer(p.id,p.onEnd); } }
</script></body></html>
